; config.ini for the SD321 demo course (copied over config/config.ini by setup.sh,
; which also fills in the secret).

[course]
number   = SD321
name     = Data Storage
timezone = America/New_York
period   = normal
secret   = REPLACE-WITH-64-HEX-DIGITS

[semester]
start    = 2026-08-17
end      = 2026-12-18
weekends = no

[schedule]
mon = class
wed = class
thu = lab

[types]
class   = Class
lab     = Lab
project = Project
exam    = Exam

[boxes]
; box = the file names that fill it (the first one found wins) | label
title             = index.html, actual_lab.html, index.md  | Lesson
homework          = homework.html, homework.md             | Homework
homework-solution = answers.html, answers.pdf              | Answers
lab-solution      = actual_solution.html, labanswers.html  | Solution
slides            = slides.pdf, slides.pptx                | Slides
instructor        = instructor.html, instructor.md         | Instructor

[notes]
notes             = notes.txt, notes.html, notes.md
reading           = reading.txt

[users]
valid          = 2026-08-17 until 2026-12-18 23:59
session        = 8h
login_attempts = 5 per 15m

[replace]
classyear      = 28
classyear2     = 29
classyearplebe = 25
due            = Wednesdays at 2200
answerserver   = courses.cs.usna.edu
server         = db.cs.usna.edu
servershort    = db
