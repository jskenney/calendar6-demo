<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Course calendar</title>
<link rel="stylesheet" href="app/app.css">
<script type="module" src="app/app.js"></script>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="#/">
      <span class="brand-number" id="brand-number"></span>
      <span class="brand-name" id="brand-name"></span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Course"></nav>
    <div class="site-tools">
      <div class="menu" id="menu" hidden>
        <button class="button menu-button" id="menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-panel"></button>
        <div class="menu-panel" id="menu-panel" hidden></div>
      </div>
      <div class="viewer" id="viewer"></div>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <p class="status">Loading…</p>
</main>
<dialog class="login" id="login">
  <form id="login-form" method="dialog">
    <h2>Log in</h2>
    <p class="login-hint">For instructors and course staff. Students do not need to log in.</p>
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <div class="login-actions">
      <button class="button" type="button" id="login-cancel">Cancel</button>
      <button class="button primary" type="submit" id="login-submit">Log in</button>
    </div>
  </form>
</dialog>
<noscript><p class="status">This course site needs JavaScript.</p></noscript>
</body>
</html>
